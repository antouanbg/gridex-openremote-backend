# Read the same private backend --env-file as all other backend overrides.
services:
  manager:
    image: gridex-openremote-manager:1.30.0-organisation-access-v3
    build: ./services/openremote-issuer
    environment:
      OR_KEYCLOAK_PUBLIC_ISSUER_BASE: ${GRIDEX_PUBLIC_AUTH_BASE:?required}
      OR_KEYCLOAK_DISABLE_ISSUER_VALIDATION: 'false'
