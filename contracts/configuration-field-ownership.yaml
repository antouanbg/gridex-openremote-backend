    - { field: "arrays[].orientationProfile", postgresql: true, openremote: configurationOrientationProfile, edge: none, readOnly: false }
    - { field: "arrays[].mountingType", postgresql: true, openremote: configurationMountingType, edge: none, readOnly: false }
    - { field: "arrays[].trackingType", postgresql: true, openremote: configurationTrackingType, edge: config, readOnly: false }
    - { field: "arrays[].moduleLayout", postgresql: true, openremote: configurationModuleLayout, edge: config, readOnly: false }
    - { field: "arrays[].dcKwp", postgresql: true, openremote: configurationDcKwp, edge: none, readOnly: false }
    - { field: "arrays[].tiltDeg", postgresql: true, openremote: configurationTiltDeg, edge: none, readOnly: false }
