version: 1
description: Canonical ownership matrix for GrideX configuration and live read-only fields.
legend:
  postgresql: Canonical durable configuration in GrideX PostgreSQL.
  openremote: Allow-listed Asset attribute, or null when the field is not projected.
  edge: none, config, driver, or runtime.
  readOnly: True when the portal may display but never edit the value.
sections:
  site:
    - { field: name, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: siteCode, postgresql: true, openremote: gridexSiteCode, edge: config, readOnly: false }
    - { field: countryCode, postgresql: true, openremote: countryCode, edge: none, readOnly: false }
    - { field: latitude, postgresql: true, openremote: location, edge: none, readOnly: false }
    - { field: longitude, postgresql: true, openremote: location, edge: none, readOnly: false }
    - { field: timezone, postgresql: true, openremote: timezone, edge: config, readOnly: false }
    - { field: marketCode, postgresql: true, openremote: marketCode, edge: none, readOnly: false }
    - { field: marketParticipationEnabled, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: traderName, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: importScheduleCode, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: exportScheduleCode, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: settlementIntervalMinutes, postgresql: true, openremote: null, edge: none, readOnly: false }
    - { field: openRemoteSiteAssetId, postgresql: true, openremote: binding, edge: none, readOnly: true }
