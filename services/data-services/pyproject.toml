[project]
name = "gridex-data"
version = "0.1.0"
description = "OpenRemote-driven ENTSO-E and Open-Meteo data services"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.1", "pydantic>=2", "pydantic-settings>=2"]

[project.scripts]
gridex-data = "gridex_data.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
