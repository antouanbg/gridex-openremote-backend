# Opt-in after migrations 010/011, with the ONE private backend --env-file.
services:
  heartbeat-alert-worker:
    build: ./services/gridex-api
    command: [node, src/heartbeat-alert-worker.mjs]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: gridex-db
      PGDATABASE: gridex
      PGUSER: gridex
      PGPASSWORD: ${GRIDEX_DATABASE_PASSWORD:?required}
      GRIDEX_HEARTBEAT_OFFLINE_SECONDS: ${GRIDEX_HEARTBEAT_OFFLINE_SECONDS:-90}
      OPENREMOTE_BASE_URL: http://manager:8080
      OPENREMOTE_REALM: gridex
      OPENREMOTE_SERVICE_CLIENT_ID: ${OPENREMOTE_SERVICE_CLIENT_ID:-gridex-api}
      OPENREMOTE_SERVICE_CLIENT_SECRET: ${OPENREMOTE_SERVICE_CLIENT_SECRET:?required}
      OIDC_TOKEN_ENDPOINT: http://keycloak:8080/auth/realms/gridex/protocol/openid-connect/token
      GRIDEX_MAILGUN_REGION: ${GRIDEX_MAILGUN_REGION:?required}
      GRIDEX_MAILGUN_DOMAIN: ${GRIDEX_MAILGUN_DOMAIN:?required}
      GRIDEX_MAILGUN_FROM: ${GRIDEX_MAILGUN_FROM:?required}
      GRIDEX_MAILGUN_API_KEY: ${GRIDEX_MAILGUN_API_KEY:?required}
      GRIDEX_MAILGUN_BCC: ${GRIDEX_MAILGUN_BCC:-}
    networks: [backend, email-egress]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
networks:
  email-egress: {}
