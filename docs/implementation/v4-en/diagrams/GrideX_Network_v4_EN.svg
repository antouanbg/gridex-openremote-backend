<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">GrideX v4 site network architecture</title>
  <desc id="desc">Windows 11 WireGuard hub and Docker backend connected to isolated site routers. ROCK Pi and ESP32 devices have no WireGuard clients. CONTROL and TELEMETRY networks are separated, OT stays local, and public MQTT is disabled.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563a6"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16866f"/></marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#18324b"/></marker>
    <style>
      .bg{fill:#f7f9fc}.zone{fill:#eef4fb;stroke:#8aa9c9;stroke-width:2}.site-a{fill:#fbfdff;stroke:#2563a6;stroke-width:3}.site-b{fill:#fbfffd;stroke:#16866f;stroke-width:3}.card{fill:#fff;stroke:#a9bdd0;stroke-width:2}.control{fill:#edf4ff;stroke:#73a2d6;stroke-width:2}.telemetry{fill:#ecfaf5;stroke:#71b8a7;stroke-width:2}.ot{fill:#fff7e8;stroke:#d2a85d;stroke-width:2}.warning{fill:#fff0f0;stroke:#d79191;stroke-width:2}.title{font:700 38px Arial,sans-serif;fill:#18324b}.subtitle{font:400 21px Arial,sans-serif;fill:#31516e}.section{font:700 24px Arial,sans-serif;fill:#18324b}.site-title-a{font:700 23px Arial,sans-serif;fill:#2563a6}.site-title-b{font:700 23px Arial,sans-serif;fill:#16866f}.head{font:700 19px Arial,sans-serif;fill:#18324b}.text{font:400 17px Arial,sans-serif;fill:#2e4962}.small{font:400 15px Arial,sans-serif;fill:#435f76}.danger{font:700 17px Arial,sans-serif;fill:#a33b3b}.flow-a{fill:none;stroke:#2563a6;stroke-width:4}.flow-b{fill:none;stroke:#16866f;stroke-width:4}.flow-dark{fill:none;stroke:#18324b;stroke-width:3}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1180"/>
  <text class="title" x="48" y="58">GrideX v4 | Per-site network architecture</text>
  <text class="subtitle" x="48" y="92">WireGuard runs on Windows and site routers · ROCK Pi and ESP32 hold no VPN keys</text>

  <rect class="zone" x="48" y="125" width="1504" height="330" rx="24"/>
  <text class="section" x="72" y="163">CENTRAL PLATFORM · WINDOWS 11 BACKEND</text>
  <rect class="card" x="76" y="190" width="350" height="116" rx="16"/>
  <text class="head" x="98" y="224">Native WireGuard hub service</text>
  <text class="text" x="98" y="252">One peer and unique key per site router</text>
  <text class="danger" x="98" y="282">No Windows transit between sites</text>
  <rect class="card" x="76" y="327" width="350" height="92" rx="16"/>
  <text class="head" x="98" y="361">Central router / NAT</text>
  <text class="text" x="98" y="390">WireGuard UDP only; web per TLS plan</text>

  <rect class="card" x="470" y="190" width="1050" height="229" rx="18"/>
  <text class="section" x="494" y="225">DOCKER · six core services</text>
  <rect class="control" x="496" y="248" width="220" height="68" rx="12"/><text class="head" x="516" y="278">HAProxy</text><text class="small" x="516" y="302">MQTTS only on VPN</text>
  <rect class="control" x="748" y="248" width="255" height="68" rx="12"/><text class="head" x="768" y="278">OpenRemote Manager</text><text class="small" x="768" y="302">Assets · MQTT · rules</text>
  <rect class="control" x="1035" y="248" width="210" height="68" rx="12"/><text class="head" x="1055" y="278">PostgreSQL / OR</text><text class="small" x="1055" y="302">Internal SQL only</text>
  <rect class="control" x="496" y="334" width="220" height="60" rx="12"/><text class="head" x="516" y="370">GrideX API</text>
  <rect class="control" x="748" y="334" width="255" height="60" rx="12"/><text class="head" x="768" y="370">Keycloak · OIDC</text>
  <rect class="control" x="1035" y="334" width="210" height="60" rx="12"/><text class="head" x="1055" y="370">PostgreSQL / GrideX</text>
  <path class="flow-dark" d="M716 282 H748" marker-end="url(#arrow-dark)"/><path class="flow-dark" d="M1003 282 H1035" marker-end="url(#arrow-dark)"/>
  <text class="small" x="1270" y="273">No public SQL, Modbus,</text><text class="small" x="1270" y="295">Docker API or admin ports</text>

  <rect class="card" x="465" y="475" width="670" height="62" rx="15"/>
  <text class="head" x="583" y="514">INTERNET · encrypted WireGuard UDP transport</text>
  <path class="flow-a" d="M260 455 V565 H370"/>
  <path class="flow-b" d="M340 455 V555 H1230 V565"/>
  <text class="danger" x="566" y="568">Separate peers · no site-to-site routing</text>

  <rect class="site-a" x="48" y="590" width="730" height="500" rx="24"/>
  <text class="site-title-a" x="72" y="628">SITE A · unique CONTROL and TELEMETRY networks</text>
  <rect class="card" x="76" y="654" width="674" height="92" rx="15"/>
  <text class="head" x="98" y="686">Site router A · WireGuard key exists only here</text>
  <text class="small" x="98" y="714">Routed VPN · firewall · private DNS/NTP · no VPN source NAT</text>
  <rect class="control" x="76" y="790" width="300" height="150" rx="15"/>
  <text class="head" x="98" y="824">CONTROL</text><text class="text" x="98" y="854">ROCK Pi Edge</text><text class="small" x="98" y="882">Local controller and safety</text><text class="danger" x="98" y="910">No WireGuard</text>
  <rect class="telemetry" x="450" y="790" width="300" height="150" rx="15"/>
  <text class="head" x="472" y="824">TELEMETRY</text><text class="text" x="472" y="854">ESP32 / EMS Wi-Fi</text><text class="small" x="472" y="882">TLS + per-device MQTT identity</text><text class="danger" x="472" y="910">No WireGuard</text>
  <text class="site-title-a" x="112" y="775">Modbus TCP 1502</text><text class="small" x="138" y="792">through VPN</text>
  <text class="site-title-a" x="515" y="775">MQTTS 8883</text><text class="small" x="540" y="792">through VPN</text>
  <path class="flow-dark" d="M226 746 V790" marker-end="url(#arrow-dark)"/><path class="flow-b" d="M600 790 V746" marker-end="url(#arrow-green)"/>
  <path class="flow-dark dash" d="M226 940 V970 H600 V940"/>
  <path class="flow-dark" d="M226 970 V995" marker-end="url(#arrow-dark)"/>
  <text class="small" x="318" y="965">RS485 remains local</text>
  <rect class="ot" x="76" y="995" width="674" height="70" rx="14"/>
  <text class="head" x="98" y="1024">OT · PCS / BMS only through ROCK Pi second NIC</text>
  <text class="small" x="98" y="1050">No VPN route, no default gateway · local protection stays independent</text>

  <rect class="site-b" x="822" y="590" width="730" height="500" rx="24"/>
  <text class="site-title-b" x="846" y="628">SITE B · unique CONTROL and TELEMETRY networks</text>
  <rect class="card" x="850" y="654" width="674" height="92" rx="15"/>
  <text class="head" x="872" y="686">Site router B · different peer and unique key</text>
  <text class="small" x="872" y="714">Routed VPN · firewall · private DNS/NTP · no VPN source NAT</text>
  <rect class="control" x="850" y="790" width="300" height="150" rx="15"/>
  <text class="head" x="872" y="824">CONTROL</text><text class="text" x="872" y="854">ROCK Pi Edge</text><text class="small" x="872" y="882">Local controller and safety</text><text class="danger" x="872" y="910">No WireGuard</text>
  <rect class="telemetry" x="1224" y="790" width="300" height="150" rx="15"/>
  <text class="head" x="1246" y="824">TELEMETRY</text><text class="text" x="1246" y="854">ESP32 / EMS Wi-Fi</text><text class="small" x="1246" y="882">TLS + per-device MQTT identity</text><text class="danger" x="1246" y="910">No WireGuard</text>
  <text class="site-title-b" x="886" y="775">Modbus TCP 1502</text><text class="small" x="912" y="792">through VPN</text>
  <text class="site-title-b" x="1289" y="775">MQTTS 8883</text><text class="small" x="1314" y="792">through VPN</text>
  <path class="flow-dark" d="M1000 746 V790" marker-end="url(#arrow-dark)"/><path class="flow-b" d="M1374 790 V746" marker-end="url(#arrow-green)"/>
  <path class="flow-dark dash" d="M1000 940 V970 H1374 V940"/>
  <path class="flow-dark" d="M1000 970 V995" marker-end="url(#arrow-dark)"/>
  <text class="small" x="1092" y="965">RS485 remains local</text>
  <rect class="ot" x="850" y="995" width="674" height="70" rx="14"/>
  <text class="head" x="872" y="1024">OT · PCS / BMS only through ROCK Pi second NIC</text>
  <text class="small" x="872" y="1050">No VPN route, no default gateway · local protection stays independent</text>

  <rect class="warning" x="48" y="1110" width="1504" height="48" rx="14"/>
  <text class="danger" x="70" y="1141">Public surface: WireGuard UDP and approved web TLS only. MQTT 8883 is VPN-only; router/VPN loss never disables local safety.</text>
</svg>
