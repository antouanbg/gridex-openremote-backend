# Optional private operator visualisation. Never include this overlay in the
# public proxy deployment until portal SSO and tenant isolation are reviewed.
services:
  gridex-grafana:
    image: ${GRIDEX_GRAFANA_IMAGE:?pin a reviewed Grafana OSS image digest in the private backend env}
    profiles: [observability]
    restart: unless-stopped
    networks: [backend]
    depends_on:
      gridex-market-db: {condition: service_healthy}
    ports:
      - '127.0.0.1:${GRIDEX_GRAFANA_LOCAL_PORT:-3300}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRIDEX_GRAFANA_ADMIN_USER:-gridex-operator}
      GF_SECURITY_ADMIN_PASSWORD: ${GRIDEX_GRAFANA_ADMIN_PASSWORD:?required only when Grafana overlay is enabled}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gridex-market-bg.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Sofia
      GF_USERS_DEFAULT_THEME: dark
      GRIDEX_GRAFANA_MARKET_READER_PASSWORD: ${GRIDEX_GRAFANA_MARKET_READER_PASSWORD:?required only when Grafana overlay is enabled}
    volumes:
      - gridex-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  gridex-grafana-data:
