schema_version: 1
policy:
  reference_only_status: needs-lab-validation
  production_status: confirmed
  notes:
    - A published map is not automatically a production-ready GrideX driver.
    - Exact model, firmware, transport, addressing, word order, scale, polarity, limits and write safety must be validated.
    - Vendor documents and upstream source code remain under their original licences; this file stores metadata and links only.

drivers:
  - key: suntech.sunstorage-pro-261
    manufacturer: Suntech
    product_family: SunStorage Pro 261 / STE-261L
    device_types: [battery, inverter]
    transports: [modbus-tcp]
    status: confirmed
    implementation: config/sunstorage-pro-261.yaml
    notes: Confirmed register semantics, Int32 ABCD word order, scale 10, heartbeat and command prerequisites.

