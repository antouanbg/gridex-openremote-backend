version: 1
purpose: GrideX OpenRemote setup blueprint for the first STE-261L site
asset_tree:
  - id: organisation
    type: Organisation
    children:
      - id: site
        type: Site
        children:
          - id: pcc_meter
            type: ElectricityMeter
          - id: mbus_nodes
            type: GroupAsset
            children:
              - {id: meter_node_1, type: ElectricityMeter}
              - {id: evse_node_1, type: ElectricityCharger}
              - {id: inverter_node_1, type: PowerConverter}
          - id: ste261l
            type: ElectricityBattery
            children:
              - {id: pcs, type: PowerConverter}
              - {id: bms, type: BatteryManagementSystem}
              - {id: thermal, type: ThermalManagement}
              - {id: safety_io, type: SafetySystem}
          - id: strategy
            type: EnergyStrategy
          - id: control
            type: EnergyControl

attributes:
  ste261l:
    actualPowerKw: {type: number, source: edge.input.0, history: true, unit: kW}
    socPct: {type: number, source: edge.input.1, history: true, unit: "%"}
    sohPct: {type: number, source: edge.input.2, history: true, unit: "%"}
    voltageV: {type: number, source: edge.input.3, history: true, unit: V}
    currentA: {type: number, source: edge.input.4, history: true, unit: A}
    maxChargeKw: {type: number, source: edge.input.5, history: true, unit: kW}
    maxDischargeKw: {type: number, source: edge.input.6, history: true, unit: kW}
    statusCode: {type: integer, source: edge.input.7, history: true}
    systemFlags: {type: integer, source: edge.input.8, history: true}
    dcPowerKw: {type: number, source: edge.input.15, history: true, unit: kW}
    commandedPowerKw: {type: number, source: edge.input.16, history: true, unit: kW}
    pcsStatus: {type: integer, source: edge.input.17, history: true}
    reactivePowerKvar: {type: number, source: edge.input.18, history: true, unit: kVAr}
    accumulatedChargeKwh: {type: number, source: edge.input.19+20, transform: uint32-x10, history: true, unit: kWh}
    accumulatedDischargeKwh: {type: number, source: edge.input.21+22, transform: uint32-x10, history: true, unit: kWh}
    dailyChargeKwh: {type: number, source: edge.input.23, history: true, unit: kWh}
    dailyDischargeKwh: {type: number, source: edge.input.24, history: true, unit: kWh}
    alarmBits: {type: integer, source: edge.input.25, history: true}
    frequencyHz: {type: number, source: edge.input.28, history: true, unit: Hz}
    socUpperLimitPct: {type: number, source: edge.input.29, history: true, unit: "%"}
    socLowerLimitPct: {type: number, source: edge.input.30, history: true, unit: "%"}
    extendedTelemetryValid: {type: boolean, source: edge.input.31, history: true}
  control:
    powerCommand: {type: json, writable_by: [gridex_api], processed_by: protected_power_command_rule}
    commandSequence: {type: integer, target: edge.holding.0, writable_by: [protected_rule], write_last: true}
    requestedPowerKw: {type: number, target: edge.holding.1, writable_by: [strategy, operator], unit: kW}
    enable: {type: boolean, target: edge.holding.2, writable_by: [operator]}
    emsHeartbeat: {type: integer, target: edge.holding.3, writable_by: [system]}
    appliedPowerKw: {type: number, source: edge.input.11, history: true, unit: kW}
    controlReady: {type: boolean, source: edge.input.12, history: true}
    limitsValid: {type: boolean, source: edge.input.9.bit1, history: true}
    configuredMaxChargeKw: {type: number, source: edge.input.13, history: true, unit: kW}
    configuredMaxDischargeKw: {type: number, source: edge.input.14, history: true, unit: kW}
    requestedRunState: {type: boolean, target: edge.holding.6, writable_by: [operator, admin]}
    requestedReactivePowerKvar: {type: number, target: edge.holding.7, writable_by: [operator, admin], unit: kVAr}
    requestedSocUpperPct: {type: number, target: edge.holding.8, writable_by: [operator, admin], range: [1, 100], unit: "%"}
    requestedSocLowerPct: {type: number, target: edge.holding.9, writable_by: [operator, admin], range: [0, 99], unit: "%"}
    operatorActionMask: {type: integer, target: edge.holding.5, writable_by: [protected_rule]}
    operatorApplyKey: {type: integer, target: edge.holding.10, writable_by: [protected_rule], hidden: true}
    operatorSequence: {type: integer, target: edge.holding.4, writable_by: [protected_rule], write_last: true}
    lastOperatorSequence: {type: integer, source: edge.input.26, history: true}
    lastOperatorResult: {type: integer, source: edge.input.27, history: true}
  strategy:
    mode: {type: string, values: [automatic, price_arbitrage, self_consumption, zero_export, peak_shaving, manual]}
    targetSocPct: {type: number, range: [0, 100], unit: "%"}
    threeDayPvForecastKwh: {type: number_array, history: true, unit: kWh}
    dayAheadPriceEurMwh: {type: number_array, history: true, unit: EUR/MWh}
    loadForecastKw: {type: number_array, history: true, unit: kW}
    blockExportAtNegativePrice: {type: boolean, default: true}
  node_template:
    online: {type: boolean, source: direct-mqtt, history: true}
    actualPowerKw: {type: number, source: direct-mqtt, history: true, unit: kW}
    energyWh: {type: integer, source: direct-mqtt, history: true, unit: Wh}
    deviceState: {type: integer, source: direct-mqtt, history: true}
    alarmBits: {type: integer, source: direct-mqtt, history: true}
    quality: {type: integer, source: direct-mqtt, history: true}
    heartbeat: {type: integer, source: direct-mqtt, history: false}
    edgeNodeOnline: {type: boolean, source: edge.node_slot.online, history: true}
    edgeActualPowerKw: {type: number, source: edge.node_slot.power, history: true, unit: kW}
    edgeEnergyWh: {type: integer, source: edge.node_slot.energy, history: true, unit: Wh}
    edgeSampleAgeSeconds: {type: integer, source: edge.node_slot.age, history: false, unit: s}
    effectivePowerKw: {type: number, source: freshness-arbitration-rule, history: true, unit: kW}

agent:
  type: ModbusTcpAgent
  endpoint: GRIDEX_EDGE_OT_IP
  port: 1502
  unit_id: 1
  request_interval_ms: 1000
  addressing: pdu-zero-based

command_policy:
  - OpenRemote writes only the normalized Edge holding registers.
  - OpenRemote never writes STE-261L registers 5001, 5002, 5005, 5006, 5301 or 5302 directly.
  - Edge is authoritative for BMS limits, configured caps, software fuse, heartbeat and safe-state.
  - requestedPowerKw is positive for discharge and negative for charge.
  - A stale EMS heartbeat causes Edge to apply zero power.
  - OpenRemote updates requested power and enable before incrementing command sequence.
  - OpenRemote refreshes emsHeartbeat at least every 10 seconds; Edge timeout is 15 seconds.
  - Start/stop, reactive power and SOC limits are operator-only actions and never originate from the automatic price strategy.
  - The protected operator rule writes action fields and apply key before incrementing operator sequence last.
  - A stop action writes active power 0 before writing vendor register 5003=0.
