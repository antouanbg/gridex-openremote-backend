version: 0.1-draft
transport:
  protocol: modbus-tcp
  port: 1502
  unit_id: 1
  addressing: pdu-zero-based
canonical_sign:
  positive_power: discharge
  negative_power: charge
registers:
  holding:
    - {address: 0, name: command.sequence, type: uint16, scale: 1, access: rw}
    - {address: 1, name: command.requested_power_kw, type: int16, scale: 10, access: rw}
    - {address: 2, name: command.enable, type: uint16, scale: 1, access: rw}
    - {address: 3, name: command.ems_heartbeat, type: uint16, scale: 1, access: rw}
  input:
    - {address: 0, name: power.actual_kw, type: int16, scale: 10, access: r}
    - {address: 1, name: battery.soc_pct, type: uint16, scale: 10, access: r}
    - {address: 2, name: battery.soh_pct, type: uint16, scale: 1, access: r}
    - {address: 3, name: battery.voltage_v, type: uint16, scale: 10, access: r}
    - {address: 4, name: battery.current_a, type: int16, scale: 10, access: r}
    - {address: 5, name: limits.max_charge_kw, type: uint16, scale: 10, access: r}
    - {address: 6, name: limits.max_discharge_kw, type: uint16, scale: 10, access: r}
    - {address: 7, name: battery.status_code, type: uint16, scale: 1, access: r}
    - {address: 8, name: battery.system_flags, type: uint16, scale: 1, access: r}
    - {address: 9, name: edge.quality_bits, type: uint16, scale: 1, access: r}
    - {address: 10, name: edge.state, type: uint16, scale: 1, access: r}
    - {address: 11, name: command.applied_power_kw, type: int16, scale: 10, access: r}
    - {address: 12, name: edge.control_ready, type: uint16, scale: 1, access: r}
    - {address: 13, name: limits.configured_max_charge_kw, type: uint16, scale: 10, access: r}
    - {address: 14, name: limits.configured_max_discharge_kw, type: uint16, scale: 10, access: r}
quality_bits:
  0: vendor_comms_ok
  1: bms_limits_valid
  2: ems_connected
  3: heartbeat_ok
  4: no_active_fault
  5: pcs_control_ready
edge_states:
  0: boot
  1: waiting_for_comms
  2: waiting_for_bms_limits
  3: ready
  4: safe_mode
  5: fault
  6: commissioning_locked
  7: waiting_for_pcs_ready
write_order:
  - command.requested_power_kw
  - command.enable
  - command.ems_heartbeat
  - command.sequence_last
timing:
  ems_heartbeat_refresh_seconds: 10
  edge_command_timeout_seconds: 15
node_slots:
  base_address: 256
  stride: 16
  count: 32
  source: continuous-rs485-mbus-polling
  registers:
    - {offset: 0, name: online, type: uint16, scale: 1}
    - {offset: 1, name: mbus_address, type: uint16, scale: 1}
    - {offset: 2, name: node_type, type: uint16, scale: 1}
    - {offset: 3, name: node_state, type: uint16, scale: 1}
    - {offset: 4, name: driver_id, type: uint16, scale: 1}
    - {offset: 5, name: quality, type: uint16, scale: 1}
    - {offset: 6, name: heartbeat, type: uint16, scale: 1}
    - {offset: 7, name: edge_actual_power_kw, type: int16, scale: 10}
    - {offset: 8, name: edge_energy_wh_high, type: uint16, scale: 1}
    - {offset: 9, name: edge_energy_wh_low, type: uint16, scale: 1}
    - {offset: 10, name: device_state, type: uint16, scale: 1}
    - {offset: 11, name: alarm_bits, type: uint16, scale: 1}
    - {offset: 12, name: age_seconds, type: uint16, scale: 1}
    - {offset: 13, name: direct_cloud_connected, type: uint16, scale: 1}
