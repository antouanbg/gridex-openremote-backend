version: 2
purpose: ROCK Pi bridge telemetry from OT ESP32 nodes to GrideX backend ingestion
transport:
  protocol: mqtt
  tls: required
  listener: private-vpn-only
  broker: GrideX private broker reachable through the Site Router WireGuard tunnel
authentication:
  owner: ROCK Pi deployment configuration only
  username: "{rockpi_service_user}"
  password: "{rockpi_service_user_secret}"
  client_id: "gridex-{site_id}-{gateway_id}"
  client_id_must_be_unique: true
  production_recommendation: one restricted client identity per site gateway; never provision broker credentials to ESP32
publish_topic: "gridex/v1/sites/{site_id}/edge/{gateway_id}/nodes/{slot}/telemetry"
attributes:
  online: {type: boolean, history: true, source: rockpi-mqtt-bridge}
  actualPowerKw: {type: number, unit: kW, history: true, source: rockpi-mqtt-bridge}
  energyWh: {type: integer, unit: Wh, history: true, source: rockpi-mqtt-bridge}
  deviceState: {type: integer, history: true, source: rockpi-mqtt-bridge}
  alarmBits: {type: integer, history: true, source: rockpi-mqtt-bridge}
  quality: {type: integer, history: true, source: rockpi-mqtt-bridge}
  heartbeat: {type: integer, history: false, source: rockpi-mqtt-bridge}
backend_ingestion:
  validates: [schemaVersion, observedAt, site, gateway, slot, driverId, quality]
  persists_to: PostgreSQL
  synchronizes_to: OpenRemote Assets
  browser_access: GrideX API only
command_topic: "gridex/v1/sites/{site_id}/edge/{gateway_id}/nodes/{slot}/command"
security:
  - Do not expose public MQTT listeners or TCP 1883.
  - The broker route exists only through the Site Router VPN; ROCK Pi and ESP32 are not WireGuard peers.
  - Validate the broker certificate against the provisioned CA certificate.
  - Grant the ROCK Pi identity access only to its own site/gateway topics.
  - ESP32 nodes have no broker credentials and never accept MQTT commands.
  - Keep Edge Modbus TCP 1502 restricted to OpenRemote or authorized backend services through the private VPN.
