name: gridex-openremote

volumes:
  proxy-data:
  manager-data:
  postgresql-data:
  gridex-db-data:

services:
  gridex-api:
    build: ./services/gridex-api
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
      gridex-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRIDEX_API_PORT:-8081}:8080"
    environment:
      OPENREMOTE_BASE_URL: ${OPENREMOTE_BASE_URL:-http://manager:8080}
      OPENREMOTE_REALM: ${OPENREMOTE_REALM:-gridex}
      OPENREMOTE_SERVICE_CLIENT_ID: ${OPENREMOTE_SERVICE_CLIENT_ID:-gridex-api}
      OPENREMOTE_SERVICE_CLIENT_SECRET: ${OPENREMOTE_SERVICE_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-gridex-portal}
      PGHOST: gridex-db
      PGPORT: 5432
      PGDATABASE: ${GRIDEX_DATABASE_NAME:-gridex}
      PGUSER: ${GRIDEX_DATABASE_USER:-gridex}
      PGPASSWORD: ${GRIDEX_DATABASE_PASSWORD}
      GRIDEX_AUTO_MIGRATE: ${GRIDEX_AUTO_MIGRATE:-false}
      GRIDEX_ALLOWED_ORIGINS: ${GRIDEX_ALLOWED_ORIGINS}
      GRIDEX_WRITES_ENABLED: ${GRIDEX_WRITES_ENABLED:-false}

  gridex-config-worker:
    build: ./services/gridex-api
    command: ["node", "src/configuration-worker.mjs"]
    restart: unless-stopped
    profiles: ["configuration-worker"]
    depends_on:
      manager:
        condition: service_healthy
      gridex-db:
        condition: service_healthy
    environment:
      OPENREMOTE_BASE_URL: ${OPENREMOTE_BASE_URL:-http://manager:8080}
      OPENREMOTE_REALM: ${OPENREMOTE_REALM:-gridex}
      OPENREMOTE_SERVICE_CLIENT_ID: ${OPENREMOTE_SERVICE_CLIENT_ID:-gridex-api}
      OPENREMOTE_SERVICE_CLIENT_SECRET: ${OPENREMOTE_SERVICE_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-gridex-portal}
      PGHOST: gridex-db
      PGPORT: 5432
      PGDATABASE: ${GRIDEX_DATABASE_NAME:-gridex}
      PGUSER: ${GRIDEX_DATABASE_USER:-gridex}
      PGPASSWORD: ${GRIDEX_DATABASE_PASSWORD}
      GRIDEX_AUTO_MIGRATE: "false"
      GRIDEX_CONFIG_WORKER_POLL_MS: ${GRIDEX_CONFIG_WORKER_POLL_MS:-2000}
      GRIDEX_CONFIG_WORKER_LEASE_SECONDS: ${GRIDEX_CONFIG_WORKER_LEASE_SECONDS:-60}
      GRIDEX_CONFIG_WORKER_MAX_ATTEMPTS: ${GRIDEX_CONFIG_WORKER_MAX_ATTEMPTS:-8}

  gridex-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GRIDEX_DATABASE_NAME:-gridex}
      POSTGRES_USER: ${GRIDEX_DATABASE_USER:-gridex}
      POSTGRES_PASSWORD: ${GRIDEX_DATABASE_PASSWORD}
    volumes:
      - gridex-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIDEX_DATABASE_USER:-gridex} -d ${GRIDEX_DATABASE_NAME:-gridex}"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: openremote/proxy:${PROXY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "80:80"
      - "${OR_SSL_PORT:-443}:443"
      - "${VPN_BIND_ADDRESS:?set VPN-only bind address}:8883:8883"
    volumes:
      - proxy-data:/deployment
    environment:
      DOMAINNAME: ${OR_HOSTNAME:-localhost}

  postgresql:
    image: openremote/postgresql:${POSTGRESQL_VERSION:-latest-slim}
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage

  keycloak:
    image: openremote/keycloak:${KEYCLOAK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ./deployment:/deployment
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD}
      KC_HOSTNAME: ${OR_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${OR_SSL_PORT:--1}

  manager:
    image: openremote/manager:${MANAGER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      OR_ADMIN_PASSWORD: ${OR_ADMIN_PASSWORD}
      OR_HOSTNAME: ${OR_HOSTNAME:-localhost}
      OR_SSL_PORT: ${OR_SSL_PORT:--1}
      OR_DEV_MODE: "false"
      OR_METRICS_ENABLED: "true"
    volumes:
      - manager-data:/storage
      - ./deployment:/deployment
